# Tooling configuration for the hermes-lcm plugin.
#
# This file pins lint settings so `ruff` behaves identically locally and in
# CI, and declares minimal PEP 621 project metadata.
#
# Why the [project] table is required: Hermes Agent's package manager (PM)
# snapshots every pyproject-bearing plugin into a uv workspace as a "virtual"
# member and injects a [project] table with only a name when the plugin has no
# [project] of its own. uv >= 0.12 hard-rejects a [project] table that lacks
# `version` (or `project.dynamic`), which made `uv lock` fail for every
# enabled hermes-lcm install:
#
#   error: Failed to parse: plugin-sources/<key>/pyproject.toml
#   TOML parse error: `pyproject.toml` is using the `[project]` table, but
#   the required `project.version` field is neither set nor present in the
#   `project.dynamic` list
#
# Declaring the table here (with `version`) keeps the PM workspace lock clean.
# The plugin is not built or installed as a package by the PM workspace: it
# has no [build-system], and [tool.uv] package = false keeps it a virtual
# workspace member uv will not build or install during project operations.
# Do NOT add a [build-system]: it would flip this member to buildable in
# the PM workspace, defeat the PM's unique-name virtual-member handling,
# and change the install story. Supported installation remains
# `scripts/install.sh` / clone, not pip.

[project]
name = "hermes-lcm"
version = "1.0.0-rc.1"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
# Match the oldest runtime CI exercises; keeps lint aligned with the 3.11 leg.
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set: pyflakes (F) plus a focused pycodestyle subset
# (E4/E7/E9). We deliberately do not enable line-length (E501) or import
# sorting (I) -- the codebase predates both and enforcing either would be a
# large, purely cosmetic reformat with no behavioural benefit.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # module-import-not-at-top-of-file: several modules import after a
    # sys.path / optional-dependency bootstrap, so imports legitimately
    # follow executable statements.
    "E402",
]
